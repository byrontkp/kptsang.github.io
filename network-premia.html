  <script>
  (() => {
    'use strict';
    const form = document.getElementById('unlock-form');
    const field = document.getElementById('password');
    const button = document.getElementById('unlock');
    const message = document.getElementById('message');
    const payload = JSON.parse(document.getElementById('encrypted-page').textContent);
    const bytes = text => Uint8Array.from(atob(text), c => c.charCodeAt(0));
    if (!window.crypto?.subtle || !window.DecompressionStream) {
      message.textContent = 'Please open this page over HTTPS in an up-to-date browser.';
      button.disabled = true;
    }
    form.addEventListener('submit', async event => {
      event.preventDefault();
      if (button.disabled) return;
      button.disabled = true;
      button.textContent = 'Opening…';
      message.textContent = '';
      let compressed;
      try {
        const material = await crypto.subtle.importKey('raw', new TextEncoder().encode(field.value), 'PBKDF2', false, ['deriveKey']);
        field.value = '';
        const key = await crypto.subtle.deriveKey({name:'PBKDF2', hash:'SHA-256', salt:bytes(payload.salt), iterations:payload.iterations}, material, {name:'AES-GCM', length:256}, false, ['decrypt']);
        compressed = await crypto.subtle.decrypt({name:'AES-GCM', iv:bytes(payload.iv), additionalData:new TextEncoder().encode(payload.context), tagLength:128}, key, bytes(payload.ciphertext));
      } catch (_) {
        message.textContent = 'Incorrect password. Please try again.';
        button.disabled = false;
        button.textContent = 'Open demonstration';
        field.focus();
        return;
      }
      try {
        const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html = await new Response(stream).text();
        document.open();
        document.write(html);
        document.close();
        const lock = document.createElement('button');
        lock.type = 'button';
        lock.id = 'lock-page';
        lock.textContent = 'Lock page';
        lock.style.cssText = 'position:fixed;bottom:16px;right:16px;z-index:1000;background:#fff;color:#172c35;border:1px solid #9aaca4;box-shadow:0 2px 8px #172c3520';
        lock.addEventListener('click', () => location.reload());
        document.body.append(lock);
        // Returning through the back/forward cache must not restore an unlocked page.
        window.addEventListener('pageshow', event => { if (event.persisted) location.reload(); });
      } catch (_) {
        location.reload();
      }
    });
  })();
  </script>
